# Discrepancy Desk application and preserved FND-PG01 proof tooling.

[project]
name = "discrepancy-desk"
version = "0.0.0"
description = "Private evidence-first investigative Record system."
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.uv]
# FILE-01 is importable as an application while preserving the root proof runner.
package = true

[tool.pytest.ini_options]
testpaths = ["tests/proofs", "tests/desk"]
addopts = "-q"
# Keep the root for `tools.postgres_foundation_proofs` and add the production
# src tree for `python -m discrepancy_desk`.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
